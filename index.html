  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


  <style>
    /* --- FIX HAMBURGER ICON ON MOBILE --- */
    .navbar-toggler {
      border-color: rgba(0, 0, 0, 0.2);
    }

    .navbar-toggler-icon {
      background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba(0,0,0,0.7)' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
    }

    /* Fullscreen minimal lightbox */
    #lightboxOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.93);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
      z-index: 2000;
      cursor: zoom-out;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      /* FADE EFFECT */
    }

    #lightboxOverlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Image fade-in */
    #lightboxImage {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transition: opacity 0.35s ease 0.05s;
      border-radius: 0;
      /* ← remove curves */
    }

    #lightboxOverlay.show #lightboxImage {
      opacity: 1;
    }

    #lightboxCaption {
      margin-top: 12px;
      color: #ffffff;
      font-size: 16px;
      text-align: center;
      opacity: 0;
      transition: opacity 0.35s ease 0.1s;
    }

    #lightboxOverlay.show #lightboxCaption {
      opacity: 1;
    }

    /* bottom-right attribution for audio credit */
    #lightboxAttribution {
      position: absolute;
      right: 20px;
      bottom: 20px;
      color: #ffffff;
      font-size: 12px;
      opacity: 0.8;
    }


    /* Filter panel: hidden by default, fades in when opened */
    #filterPanel {
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      pointer-events: none;
      transition: opacity 0.5s ease, max-height 0.5s ease;
    }

    #filterPanel.open {
      opacity: 1;
      max-height: 260px;
      /* adjust if you add more filters */
      pointer-events: auto;
    }


    /* ----------------------------- 
       BASE LIGHT THEME
    ------------------------------*/
    body {
      background-color: #f8f9fa;
      color: #111;
      transition: background 0.3s, color 0.3s;
    }

    .gallery-img {
      width: 100%;
      cursor: pointer;
      display: block;
      transition: opacity 0.2s ease;
    }

    .gallery-img:hover {
      opacity: 0.9;
    }

    .bird-caption {
      font-weight: 600;
      margin-top: 0.5rem;
    }

    /* .bird-desc {
      color: #666;
      font-size: 0.9rem;
    } */

    .photo-box {
      background: transparent;
      border: none;
      box-shadow: none;
    }

    .photo-box img {
      transition: transform 0.25s ease;
    }

    .photo-box:hover img {
      transform: scale(1.03);
    }


    .highlight-bird {
      outline: 3px solid #0d6efd;
      outline-offset: 3px;
    }

    /* ----------------------------- 
       DARK MODE OVERRIDES
    ------------------------------*/
    .dark-mode {
      background-color: #121212 !important;
      color: #e8e8e8 !important;
    }

    .dark-mode .navbar {
      background-color: #1e1e1e !important;
      border-color: #333 !important;
    }

    .dark-mode .navbar-brand {
      color: #eaeaea !important;
    }

    .dark-mode .nav-link {
      color: #e0e0e0 !important;
    }

    .dark-mode .lead,
    .dark-mode p {
      color: #e5e5e5 !important;
    }

    .dark-mode h1 {
      color: #ffffff !important;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.15);
    }

    .dark-mode .text-muted {
      color: #cccccc !important;
    }

    /* .dark-mode .bird-desc {
      color: #aaa;
    } */

    .dark-mode .gallery-img {
      filter: brightness(0.9);
    }

    /* Light/dark toggle button */
    .theme-toggle-btn {
      border: 1px solid #bbb;
      border-radius: 5px;
      padding: 4px 10px;
      cursor: pointer;
      background: transparent;
      transition: background 0.3s;
    }

    .theme-toggle-btn:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .dark-mode .theme-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Glass scroll-to-top button */
    .scroll-top-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.28);
      /* translucent glass */
      color: #ffffff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.25s ease, background 0.2s ease;

      /* soft shadow like your screenshot */
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      z-index: 999;
    }

    .scroll-top-btn:hover {
      background: rgba(255, 255, 255, 0.38);
      transform: scale(1.08);
    }

    /* Dark mode version (glass but darker) */
    .dark-mode .scroll-top-btn {
      background: rgba(30, 30, 30, 0.35);
      color: #fff;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
    }

    .dark-mode .scroll-top-btn:hover {
      background: rgba(30, 30, 30, 0.45);
    }


    /* --- ARTSY FLOATING BLOBS BACKGROUND --- */
    .background-blobs {
      position: fixed;
      inset: 0;
      z-index: -1;
      /* behind everything */
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.35;
      animation: blobMove 18s ease-in-out infinite alternate;
    }

    /* Blob colours */
    .blob1 {
      width: 350px;
      height: 350px;
      background: #6ec3ff;
      /* soft blue */
      top: 5%;
      left: 10%;
    }

    .blob2 {
      width: 300px;
      height: 300px;
      background: #ff8ab8;
      /* soft pink */
      top: 40%;
      right: 5%;
      animation-delay: -6s;
    }

    .blob3 {
      width: 420px;
      height: 420px;
      background: #baffc9;
      /* mint green */
      bottom: -10%;
      left: 30%;
      animation-delay: -12s;
    }

    /* Blob movement animation */
    @keyframes blobMove {
      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(40px, -30px) scale(1.15);
      }

      100% {
        transform: translate(-20px, 20px) scale(0.95);
      }
    }

    /* Dark mode adjustment */
    .dark-mode .blob {
      opacity: 0.2;
      filter: blur(80px);
    }

    /* --- DATE RANGE (YEAR-MONTH) SLIDER (IMPROVED) --- */
    .range-wrapper { position: relative; height: 34px; margin-top: 6px; }
    .range-wrapper input[type=range]{
      position: absolute;
      left: 0; top: 0;
      width: 100%;
      margin: 0;
      pointer-events: none;          /* only thumbs are clickable */
      background: transparent;
      -webkit-appearance: none;
      appearance: none;
      accent-color: transparent;     /* avoid default blue fill where supported */
    }
    .range-wrapper input[type=range]::-webkit-slider-runnable-track{
      height: 6px;
      border-radius: 999px;
      background: transparent;       /* we'll paint the track via JS on the input element */
    }
    .range-wrapper input[type=range]::-moz-range-track{
      height: 6px;
      border-radius: 999px;
      background: transparent;
    }
    .range-wrapper input[type=range]::-webkit-slider-thumb{
      -webkit-appearance: none;
      appearance: none;
      width: 16px; height: 16px;
      border-radius: 50%;
      pointer-events: all;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.9);
      background: rgba(20,20,20,0.9);
      margin-top: -5px; /* center on 6px track */
      position: relative;
      z-index: 3;
    }
    .range-wrapper input[type=range]::-moz-range-thumb{
      width: 16px; height: 16px;
      border-radius: 50%;
      pointer-events: all;
      cursor: pointer;
      border: 2px solid rgba(255,255,255,0.9);
      background: rgba(20,20,20,0.9);
      position: relative;
      z-index: 3;
    }

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    let currentAudio = null;

    // -------- DARK MODE  --------
    function toggleTheme() {
      const body = document.body;
      body.classList.toggle("dark-mode");
      if (body.classList.contains("dark-mode")) {
        localStorage.setItem("theme", "dark");
      } else {
        localStorage.setItem("theme", "light");
      }
    }

    // We'll load data first, THEN init everything else
    window.onload = () => {
      const saved = localStorage.getItem("theme");
      if (saved === "dark") {
        document.body.classList.add("dark-mode");
      }

      // After theme, load bird data and initialise page
      fetch('data/bird_data.json')
        .then(res => res.json())
        .then(birds => initGalleryPage(birds))
        .catch(err => console.error('Error loading bird_data.json', err));
    };

    function initGalleryPage(birds) {
      const galleryRow = document.getElementById('galleryRow');

      galleryRow.innerHTML = birds.map(bird => {
        const audio = bird.audio || {};
        const audioSrc = audio.src || "";
        const audioCredit = audio.credit || "";

        return `
          <div class="col">
              <div class="photo-box">
                <img
                  src="${bird.thumbAvif}"
                  class="gallery-img"
                  loading="lazy"
                  decoding="async"
                  data-large-avif="${bird.largeAvif}"
                  data-title="${bird.title}"
                  data-location="${bird.region}"
                  data-place="${bird.place}"
                  data-date="${bird.date || ""}"
                  data-audio="${audioSrc}"
                  data-audio-credit="${audioCredit}"
                  alt="${bird.title}">
                <div class="bird-caption">${bird.title}</div>
              </div>
            </div>
          `;
      }).join('');

      const totalCountEl = document.getElementById('totalCount');
      if (totalCountEl) totalCountEl.textContent = birds.length;

      buildRegionFilters(birds);

      setupLightbox();
      setupSearchFilterRandom();
      setupScrollTop();
    }


    // -------- AUTO REGION FILTERS --------
    function titleCase(str) {
      return (str || "")
        .toLowerCase()
        .split(" ")
        .map(word => {
          if (!word) return "";
          // handle hyphenated words: "new-south" -> "New-South"
          return word.split("-").map(part => {
            if (!part) return "";
            return part.charAt(0).toUpperCase() + part.slice(1);
          }).join("-");
        })
        .join(" ")
        .trim();
    }

    function buildRegionFilters(birds) {
      const filterPanel = document.getElementById("filterPanel");
      const regionFilters = document.getElementById("regionFilters");
      if (!filterPanel || !regionFilters) return;

      // Normalise regions (trim + lowercase) and collect unique values
      const regions = Array.from(
        new Set(
          (birds || [])
            .map(b => (b.region || "").toString().trim().toLowerCase())
            .filter(Boolean)
        )
      ).sort((a, b) => a.localeCompare(b));

      // Build checkbox HTML
      regionFilters.innerHTML = regions.map((region, idx) => {
        const id = `locAuto${idx}`;
        const label = titleCase(region);
        return `
          <div class="form-check form-check-inline">
            <input class="form-check-input location-checkbox" type="checkbox" id="${id}" value="${region}">
            <label class="form-check-label" for="${id}">${label}</label>
          </div>
        `;
      }).join("");
    }


    // -------- MINIMAL LIGHTBOX (NO BOX, NO ARROWS) --------
    function setupLightbox() {
      const thumbs = Array.from(document.querySelectorAll('.gallery-img'));
      const overlay = document.getElementById('lightboxOverlay');
      const overlayImg = document.getElementById('lightboxImage');
      const overlayCaption = document.getElementById('lightboxCaption');
      const overlayAttrib = document.getElementById('lightboxAttribution');

      function openLightbox(imgEl) {
        overlayImg.style.opacity = "0";

        overlayImg.onload = () => {
          overlayImg.style.opacity = "";
        };

        overlayImg.src = imgEl.dataset.largeAvif || imgEl.getAttribute('src');

        overlayCaption.textContent = imgEl.dataset.title || '';
        overlay.classList.add('show');

        // stop any previous audio
        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }

        const audioSrc = imgEl.dataset.audio;
        const audioCredit = imgEl.dataset.audioCredit || '';
        overlayAttrib.textContent = audioCredit;

        if (audioSrc) {
          currentAudio = new Audio(audioSrc);
          currentAudio.play().catch(err => {
            console.warn('Audio autoplay was blocked:', err);
          });
        }
      }


      function closeLightbox() {
        overlay.classList.remove('show');
        overlayImg.src = '';
        overlayCaption.textContent = '';
        overlayAttrib.textContent = '';

        if (currentAudio) {
          currentAudio.pause();
          currentAudio = null;
        }
      }

      thumbs.forEach(img => {
        img.addEventListener('click', () => openLightbox(img));
      });

      overlay.addEventListener('click', closeLightbox);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && overlay.classList.contains('show')) {
          closeLightbox();
        }
      });
    }


    // -------- SEARCH / FILTER + RANDOM BIRD --------
    function setupSearchFilterRandom() {
      const searchInput = document.getElementById('searchInput');
      const randomBtn = document.getElementById('randomBtn');
      const visibleCountEl = document.getElementById('visibleCount');
      const cols = Array.from(document.querySelectorAll('#galleryRow .col'));

      const filterToggleBtn = document.getElementById('filterToggleBtn');
      const filterPanel = document.getElementById('filterPanel');
      const locationCheckboxes = Array.from(document.querySelectorAll('.location-checkbox'));


      // --- DATE RANGE (YEAR-MONTH) SLIDER ---
      const minMonthEl = document.getElementById('minMonth');
      const maxMonthEl = document.getElementById('maxMonth');
      const minMonthLabel = document.getElementById('minMonthLabel');
      const maxMonthLabel = document.getElementById('maxMonthLabel');

      
      function parseYM(ym) {
        if (!ym || typeof ym !== 'string') return null;
        const m = ym.trim().match(/^(\d{4})-(\d{2})$/);
        if (!m) return null;
        const y = parseInt(m[1], 10);
        const mo = parseInt(m[2], 10);
        if (!Number.isFinite(y) || !Number.isFinite(mo) || mo < 1 || mo > 12) return null;
        return { y, mo };
      }

      function addMonths({ y, mo }, delta) {
        // delta can be negative
        let total = (y * 12) + (mo - 1) + delta;
        const ny = Math.floor(total / 12);
        const nmo = (total % 12) + 1;
        return { y: ny, mo: nmo };
      }

      function fmtYM({ y, mo }) {
        return `${y}-${String(mo).padStart(2, '0')}`;
      }

      function buildMonths(startYM, endYM) {
        const s = parseYM(startYM);
        const e = parseYM(endYM);
        if (!s || !e) return [];
        const out = [];
        let cur = { y: s.y, mo: s.mo };
        const endIdx = (e.y * 12) + (e.mo - 1);
        while ((cur.y * 12) + (cur.mo - 1) <= endIdx) {
          out.push(fmtYM(cur));
          cur = addMonths(cur, 1);
        }
        return out;
      }

      // Initialise DISCRETE month ticks (better on iPhone)
      const birdYMs = cols
        .map(col => col.querySelector('.gallery-img')?.dataset?.date || "")
        .map(s => (typeof s === 'string' ? s.trim() : ""))
        .filter(s => /^\d{4}-\d{2}$/.test(s));

      // If there are no dates, default to a single "this month" tick
      let minYM = birdYMs.length
        ? birdYMs.reduce((a, b) => (a < b ? a : b))
        : fmtYM({ y: new Date().getFullYear(), mo: new Date().getMonth() + 1 });

      let maxYM = birdYMs.length
        ? birdYMs.reduce((a, b) => (a > b ? a : b))
        : minYM;

      // Pad the slider with extra months even if no birds exist in those months (touch-friendly)
      const PAD_MONTHS = 6;
      const minObj = addMonths(parseYM(minYM), -PAD_MONTHS);
      const maxObj = addMonths(parseYM(maxYM),  PAD_MONTHS);

      const MONTHS = buildMonths(fmtYM(minObj), fmtYM(maxObj));
      const ymToPos = new Map(MONTHS.map((ym, i) => [ym, i]));
      const posToYM = (pos) => MONTHS[Math.max(0, Math.min(MONTHS.length - 1, pos))];

      // When the thumbs overlap, keep the active one on top (prevents 'stuck' feel on mobile)
      let activeSlider = 'max';
      const setThumbZ = () => {
        if (!minMonthEl || !maxMonthEl) return;
        if (activeSlider === 'min') {
          minMonthEl.style.zIndex = 6;
          maxMonthEl.style.zIndex = 5;
        } else {
          maxMonthEl.style.zIndex = 6;
          minMonthEl.style.zIndex = 5;
        }
      };

      // Paint the track ourselves so it doesn't show the default blue fill
      function updateRangeFill() {
        if (!minMonthEl || !maxMonthEl) return;
        const minV = parseInt(minMonthEl.value, 10);
        const maxV = parseInt(maxMonthEl.value, 10);
        const minB = parseInt(minMonthEl.min, 10);
        const maxB = parseInt(minMonthEl.max, 10);
        const span = Math.max(1, maxB - minB);

        const leftPct  = ((minV - minB) / span) * 100;
        const rightPct = ((maxV - minB) / span) * 100;

        const bg = `linear-gradient(to right,
          rgba(180,180,180,0.45) 0%,
          rgba(180,180,180,0.45) ${leftPct}%,
          rgba(255,255,255,0.9) ${leftPct}%,
          rgba(255,255,255,0.9) ${rightPct}%,
          rgba(180,180,180,0.45) ${rightPct}%,
          rgba(180,180,180,0.45) 100%)`;

        minMonthEl.style.background = bg;
        maxMonthEl.style.background = bg;
      }

      if (minMonthEl && maxMonthEl) {
        minMonthEl.min = "0";
        minMonthEl.max = String(MONTHS.length - 1);
        maxMonthEl.min = "0";
        maxMonthEl.max = String(MONTHS.length - 1);

        // Set defaults to the actual observed bounds (not the padded ends)
        const defaultMinPos = ymToPos.get(minYM) ?? 0;
        const defaultMaxPos = ymToPos.get(maxYM) ?? (MONTHS.length - 1);

        minMonthEl.value = String(defaultMinPos);
        maxMonthEl.value = String(defaultMaxPos);

        const updateMonthLabels = () => {
          if (minMonthLabel) minMonthLabel.textContent = posToYM(parseInt(minMonthEl.value, 10));
          if (maxMonthLabel) maxMonthLabel.textContent = posToYM(parseInt(maxMonthEl.value, 10));
        };

        updateMonthLabels();
        setThumbZ();
        updateRangeFill();

        minMonthEl.addEventListener('pointerdown', () => { activeSlider = 'min'; setThumbZ(); });
        minMonthEl.addEventListener('mousedown', () => { activeSlider = 'min'; setThumbZ(); });

        minMonthEl.addEventListener('input', () => {
          if (parseInt(minMonthEl.value, 10) > parseInt(maxMonthEl.value, 10)) {
            minMonthEl.value = maxMonthEl.value;
          }
          updateMonthLabels();
          setThumbZ();
          updateRangeFill();
          filterBirds();
        });

        maxMonthEl.addEventListener('pointerdown', () => { activeSlider = 'max'; setThumbZ(); });
        maxMonthEl.addEventListener('mousedown', () => { activeSlider = 'max'; setThumbZ(); });

        maxMonthEl.addEventListener('input', () => {
          if (parseInt(maxMonthEl.value, 10) < parseInt(minMonthEl.value, 10)) {
            maxMonthEl.value = minMonthEl.value;
          }
          updateMonthLabels();
          setThumbZ();
          updateRangeFill();
          filterBirds();
        });
      }


      if (filterToggleBtn && filterPanel) {
        filterToggleBtn.addEventListener('click', () => {
          filterPanel.classList.toggle('open');
        });
      }

      function updateVisibleCount() {
        if (!visibleCountEl) return;
        const visible = cols.filter(col => col.style.display !== 'none').length;
        visibleCountEl.textContent = visible;
      }

      function filterBirds() {
        const q = (searchInput?.value || '').toLowerCase().trim();

        const activeLocations = locationCheckboxes
          .filter(cb => cb.checked)
          .map(cb => cb.value);

        cols.forEach(col => {
          const captionEl = col.querySelector('.bird-caption');
          const name = captionEl ? captionEl.textContent.toLowerCase() : '';
          const imgEl = col.querySelector('.gallery-img');

          const locAttr = (imgEl?.dataset.location || '').toLowerCase();
          const imgLocations = locAttr.split(',').map(x => x.trim()).filter(Boolean);

          const matchesText = name.includes(q);

          let matchesLocation = true;

          // Date range match (year-month)
          let matchesDate = true;
          if (minMonthEl && maxMonthEl) {
            const birdYM = imgEl?.dataset?.date || "";
            const birdPos = ymToPos.get((birdYM || '').trim());
            const minPos = parseInt(minMonthEl.value, 10);
            const maxPos = parseInt(maxMonthEl.value, 10);
            if (birdPos === undefined) {
              // If a bird has no date, hide it when date filter is active
              matchesDate = false;
            } else {
              matchesDate = (birdPos >= minPos && birdPos <= maxPos);
            }
          }

          if (activeLocations.length > 0) {
            matchesLocation = imgLocations.some(l => activeLocations.includes(l));
          }

          col.style.display = (matchesText && matchesLocation && matchesDate) ? '' : 'none';
        });

        updateVisibleCount();
      }

      if (searchInput) {
        searchInput.addEventListener('input', filterBirds);
      }
      locationCheckboxes.forEach(cb => cb.addEventListener('change', filterBirds));

      function clearHighlights() {
        document.querySelectorAll('.highlight-bird').forEach(el => {
          el.classList.remove('highlight-bird');
        });
      }

      function jumpToRandomBird() {
        const visibleCols = cols.filter(col => col.style.display !== 'none');
        if (visibleCols.length === 0) return;

        const randomIndex = Math.floor(Math.random() * visibleCols.length);
        const chosenCol = visibleCols[randomIndex];

        clearHighlights();
        chosenCol.classList.add('highlight-bird');
        chosenCol.scrollIntoView({ behavior: 'smooth', block: 'center' });

        setTimeout(() => {
          chosenCol.classList.remove('highlight-bird');
        }, 1200);
      }

      if (randomBtn) {
        randomBtn.addEventListener('click', jumpToRandomBird);
      }

      // initialise count once
      updateVisibleCount();
    }

    // -------- SCROLL TO TOP BUTTON --------
    function setupScrollTop() {
      const scrollTopBtn = document.getElementById("scrollTopBtn");
      if (!scrollTopBtn) return;

      window.addEventListener("scroll", () => {
        if (window.scrollY > 250) {
          scrollTopBtn.style.opacity = "1";
          scrollTopBtn.style.pointerEvents = "auto";
        } else {
          scrollTopBtn.style.opacity = "0";
          scrollTopBtn.style.pointerEvents = "none";
        }
      });

      scrollTopBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  </script>
